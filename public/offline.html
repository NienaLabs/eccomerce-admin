<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline — AdminHub</title>
    <style>
      :root {
        --ink: #222022;
        --ink-soft: #3a383a;
        --ink-muted: #6b696b;
        --surface: #ffffff;
        --surface-soft: #f5f5f0;
        --surface-muted: #eceae6;
        --primary: #c3d809;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--surface-soft);
        color: var(--ink);
        font-family: "Open Sans", system-ui, -apple-system, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 380px;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--surface-muted);
        border-radius: 20px;
        padding: 40px 28px;
        box-shadow: 0 4px 16px rgba(34, 32, 34, 0.12);
      }
      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 18px;
        background: var(--ink);
      }
      h1 {
        margin: 0 0 8px;
        font-family: Inter, system-ui, sans-serif;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.008em;
      }
      p {
        margin: 0;
        font-size: 14px;
        line-height: 1.6;
        color: var(--ink-muted);
      }
      button {
        margin-top: 28px;
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 12px;
        background: var(--primary);
        color: var(--ink);
        font-family: Inter, system-ui, sans-serif;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(195, 216, 9, 0.3);
      }
      button:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M12 2 20 5.5V11c0 5-3.4 9.1-8 11-4.6-1.9-8-6-8-11V5.5L12 2Z"
            fill="#c3d809"
          />
          <circle cx="12" cy="10" r="1.9" fill="#222022" />
          <path d="M10.6 11.4h2.8l.7 4.2h-4.2l.7-4.2Z" fill="#222022" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        AdminHub needs a connection to show live platform data. Nothing is cached
        on purpose — stale vendor and commission figures are worse than none.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
    <script>
      // Bounce straight back in the moment the connection returns.
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
